<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="Styles/style_formulario.css">
	<title>Formulario PAEC</title>
</head>
<body>
	<div class="fondo_titulo"><h1 class="titulo_formulario">Registro semanal de Acopio reciclable a CBTis No. 153</h1></div>
	<br><br>
	<form class="formulario">
	<section class="contenedor_entrega">
		<br><br>
		<div class="fondo_subtitulo"><h2 class="subtitulo_formulario">Identificación de la entrega</h2></div>
		<br>
		<label class="pregunta">Fecha de la semana:</label>
		<input type="date" name="fecha_entrega" class="respuesta" name="date">
		<br><br>
		<label class="pregunta">Responsable de la entrega (tutor):</label>
		<select name="responsable_entrega" class="respuesta" name="text">
			<optgroup label="Matutino">
			<option>CORONA ZAHUANTITLA MARICELA </option>
			<option>MENDEZ SALAS EVARISTO GUADALUPE </option>
			<option>GUTIERREZ URCID FERNANDO </option>
			<option>ROJAS RODRIGUEZ CARLOS OCTAVIO </option>
			<option>GOMEZ OREA NOEMI SUSANA </option>
			<option>CASTILLO CARDONA SAMANTHA RUBI </option>
			<option>PALMEROS ORTIZ EDGAR </option>
			<option>ESPINOZA SANCHEZ BRISEIDA </option>
			<option>CRUZ MARQUEZ MARIA DEL CARMEN </option>
			<option>TAPIA SMITH NORMA LUZ </option>
			<option>VAZQUEZ GONZALEZ GUADALUPE </option>
			<option>CERON PEREZ SELENE </option>
			<option>LEON COTE BARRERA </option>
			<option>BAEZ BARRADAS ZARINA </option>
			<option>HERNANDEZ LARA DULCE MARIA </option>
			<option>SOTELO REYES TONANTZIN</option>
			<option>PINEDA VAZQUEZ NARETH </option>
			<option>DELGADO ATONAL SYAMASUNDAR-DAS</option>
			<option>HERNANDEZ CRUZ MAXIMINO</option>
			<option>BARRIOS RODRIGUEZ GLORIA</option>
			</optgroup>
			<optgroup label="Vespertino">
			<option>JUAREZ JUAREZ ENRIQUE  </option>
			<option>MATIAS GUZMAN FABIOLA </option>
			<option>MORALES QUIROZ KAREN </option>
			<option>ATONAL FERNANDEZ STHEPANIE </option>
			<option>PEREZ CAMACHO GABINA </option>
			<option>PEREZ COYOTL ANA LAURA </option>
			<option>ITURBIDE ORTIZ LUDWINDG </option>
			<option>ARROYO SERRANO HECTOR </option>
			<option>DIYARZA MEZA MARIELA </option>
			<option>GONZALEZ GONZALES YASMIN </option>
			<option>RIVERA CASTILLO MATILDE  </option>
			<option>RAMOS BRAVO OSCAR </option>
			<option>MENA MENA IRMA </option>
			<option>BLANCAS AGUILAR CESAR  </option>
			<option>SANTIAGO GUZMAN MIGUEL ANGEL </option>
			<option>JUAREZ SOTO LORENA</option>
			<option>ESPEJEL SARTILLO LINDA  </option>
			<option>MUÑOZ CORTES BEATRIZ </option>
			<option>DE LOS SANTOS MUNIVE VICTORIA </option>
			<option>VARGAS ALTAMIRANO ALEJANDRO</option>
			</optgroup>
		</select>
		<br><br>
		<label>Grupo:</label>
		<select name="grupo_entrega" class="respuesta" name="text">
			<optgroup label="Matutino">
				<option value="1AMC">1AMC</option>
				<option value="1AMVT">1AMVT</option>
				<option value="1AMP">1AMP</option>
				<option value="1BMP">1BMP</option>
				<option value="1AMINT">1AMINT</option>
				<option value="1AMLQ">1AMLQ</option>
				<option value="1BMLQ">1BMLQ</option>
				<option value="1AMTOIN">1AMTOIN</option>
				<option value="3AMC">3AMC</option>
				<option value="3AMVT">3AMVT</option>
				<option value="3AMP">3AMP</option>
				<option value="3BMP">3BMP</option>
				<option value="3AMLQ">3AMLQ</option>
				<option value="3AMMTOIN">3AMMTOIN</option>
				<option value="5AMC">5AMC</option>
				<option value="5AMLG">5AMLG</option>
				<option value="5AMP">5AMP</option>
				<option value="5BMP">5BMP</option>
				<option value="5AMLQ">5AMLQ</option>
				<option value="5AMMTOIN">5AMMTOIN</option>
			</optgroup>
			<optgroup label="Vespertino">
				<option value="1AVC">1AVC</option>
				<option value="1AVE-C">1AVE-C</option>
				<option value="1AVI">1AVI</option>
				<option value="1AVP">1AVP</option>
				<option value="1BCP">1BCP</option>
				<option value="1AVLQ">1AVLQ</option>
				<option value="1AVMTOIN">1AMTOIN</option>
				<option value="1AVURB">1AVURB</option>
				<option value="3AVC">3AVC</option>
				<option value="3AVVT">3AVVT</option>
				<option value="3AVP">3AVP</option>
				<option value="3BVP">3BVP</option>
				<option value="3AVLQ">3AVLQ</option>
				<option value="3AMMTOIN">3AVMTOIN</option>
				<option value="5AVC">5AVC</option>
				<option value="5AVLOG">5AVLOG</option>
				<option value="5AVP">5AVP</option>
				<option value="5BVP">5BVP</option>
				<option value="5AVLQ">5AVLQ</option>
				<option value="5AVMTION">5AVMTION</option>
			</optgroup>
		</select>
		<br><br>
	</section>
	<br><br>
	<section class="contenedor_cantidades">
		<br><br>
		<div class="fondo_subtitulo"><h2 class="subtitulo_formulario">Registro de cantidades</h2></div>
		<br>
		<label class="pregunta">Selecciona los productos entregados:</label>
		<br>
		<div class="cantidad_entrega">
			<label class="respuesta">
				<input type="checkbox" class="check" name="material_entrega" value="PET"> PET (botellas de plástico) <input type="number" name="cantidad" class="respuesta"> kg
			</label>
			<br><br>
			<label class="respuesta">
				<input type="checkbox" class="check" name="material_entrega" value="Cartón"> Cartón <input type="number" name="cantidad" class="respuesta"> kg
			</label>
			<br><br>
			<label class="respuesta">
				<input type="checkbox" class="check" name="material_entrega" value="Tapas"> Tapas plástico <input type="number" name="cantidad" class="respuesta"> kg
			</label>
			<br><br>
			<label class="respuesta">
				<input type="checkbox" class="check" name="material_entrega" value="Vidrio"> Vidrio <input type="number" name="cantidad" class="respuesta"> kg
			</label>
			<br><br>
			<label class="respuesta">
				<input type="checkbox" class="check" name="material_entrega" value="Electrodomesticos"> Aparatos electronicos <input type="number" name="cantidad" class="respuesta"> kg
			</label>
			<br><br>
			<label class="respuesta">
				<input type="checkbox" class="check" name="material_entrega" value="Papel"> Papel (libros y libretas) <input type="number" name="cantidad" class="respuesta"> kg
			</label>
		</div>
	</section>
	</form>
</body>
</html>
