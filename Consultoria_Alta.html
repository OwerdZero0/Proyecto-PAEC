<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de cantidades</title>

    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="Styles/style_Consultoria_Alta.css" />
</head>

<body>

    <!-- Barra superior (Centro de Acopio) -->
    <header class="topbar">
        <div class="topbar__inner">
            <div class="brand">
                <div class="brand__logo" aria-hidden="true">♻</div>
                <div class="brand__text">
                    <div class="brand__name">Centro de Acopio</div>
                    <div class="brand__sub">Sistema de consulta de entregas</div>
                </div>
            </div>

            <nav class="menu">
                <a class="menu__link" href="index.html">Inicio</a>
                <a class="menu__link menu__link--active" href="#">Consulta</a>
                <a class="menu__link" href="Reportes_Cosulta.html">Reportes</a>
            </nav>
        </div>
    </header>

    <main class="page">

        <!-- Título principal -->
        <section class="hero">
            <h1 class="hero__title">
                REGISTRO SEMANAL DE ACOPIO<br />
                RECICLABLE A CBTIS NO. 153
            </h1>
        </section>

        <!-- Panel de consulta -->
        <section class="panel">
            <header class="panel__header">
                <h2 class="panel__title">Identificación de la entrega</h2>
                <p class="panel__hint">Consulta (solo visualización)</p>
            </header>

            <div class="filters">

                <!-- Fecha -->
                <div class="field">
                    <label class="field__label" for="fecha">Fecha de la Inicio:</label>
                    <div class="control control--icon">
                        <input id="fecha" class="control__input" type="date" />
                    </div>
                </div>

                <!-- Fecha -->
                <div class="field">
                    <label class="field__label" for="fecha">Fecha Final:</label>
                    <div class="control control--icon">
                        <input id="fecha" class="control__input" type="date" />
                    </div>
                </div>

                <!-- Responsable -->
                <div class="field">
                    <label class="field__label" for="responsable">Responsable de la entrega (tutor):</label>
                    <select id="responsable" class="control__select">
                        <option value="" selected></option>
                        <option>CORONA ZAHUANTITLA MARICELA</option>
                    </select>
                </div>

                <!-- Grupo -->
                <div class="field">
                    <label class="field__label" for="grupo">Grupo:</label>
                    <select id="grupo" class="control__select">
                        <option value="" selected></option>
                        <option>1AMC</option>
                    </select>
                </div>

                <!-- Botón -->
                <div class="actions">
                    <button class="btn" type="button">Consultar</button>
                </div>

            </div>
        </section>

    </main>

</body>

</html>
